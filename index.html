<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Odyssea - De l'idée à l'incarnation</title>
    
    <script>
        (function() {
            const allowedSources = ["au-21.fr", "archipel", "netlify.app", "localhost"];
            const salesPage = "https://www.au-21.fr/pricing-plans";
            const referrer = document.referrer ? document.referrer.toLowerCase() : "";
            let isAllowed = false;
            
            if (sessionStorage.getItem("access_granted") === "true") {
                isAllowed = true;
            } else {
                for (let source of allowedSources) {
                    if (referrer.includes(source)) {
                        isAllowed = true;
                        sessionStorage.setItem("access_granted", "true");
                        break;
                    }
                }
            }
            if (!isAllowed) { window.location.href = salesPage; }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="https://www.au-21.fr/portail-des-applis" target="_top" title="Retour à l'Archipel" 
        style="position: fixed; top: 20px; left: 20px; z-index: 999999; display: block; width: 60px; height: 60px; border-radius: 50% !important; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); border: 2px solid rgba(255,255,255,0.3); overflow: hidden; cursor: pointer; transition: transform 0.2s; background-color: #000;" 
        onmouseover="this.style.transform='scale(1.1)'" 
        onmouseout="this.style.transform='scale(1)'">
        <img src="Archipel.jpg" alt="Retour Archipel" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50% !important;">
    </a>

    <div id="intro-overlay">
        <video id="intro-video-element" playsinline>
            <source src="/video22.mp4" type="video/mp4">
        </video>
    </div>

    <button id="mobile-menu-btn" onclick="toggleSidebar()" style="display:none;">☰</button>

    <div id="sidebar-overlay" onclick="toggleSidebar()" style="display:none;"></div>

    <div id="validation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Le Grimoire du Projet</h2>
                <div style="font-size:0.8rem; color:#888;">Validez les tâches pour avancer.</div>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
                <button class="modal-btn save" onclick="saveSummaryData(false)">💾 Sauvegarder</button>
                <button id="modal-next-btn" class="modal-btn next" onclick="saveSummaryData(true)">Valider & Étape Suivante ➔</button>
            </div>
        </div>
    </div>

    <div id="game-input-modal" class="modal" style="z-index: 200;">
        <div class="modal-content" style="max-height: 300px; height: auto;">
            <div class="modal-header">
                <h2 id="input-modal-title">Nouvelle Aventure</h2>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; justify-content:center;">
                <input type="text" id="game-name-input" class="modal-textarea" style="min-height:50px; text-align:center; font-size:1.2rem;" placeholder="Nom du projet...">
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeInputModal()">Annuler</button>
                <button class="modal-btn next" id="input-modal-confirm-btn">Valider</button>
            </div>
        </div>
    </div>

    <div id="screen-hub">
        <div class="hub-content">
            <div class="hub-logo" style="border-radius: 50% !important; overflow: hidden;">
                <img src="GardeOdyssea.jpg" alt="Garde Odyssea" style="border-radius: 50% !important; width:100%; height:100%; object-fit:cover;">
            </div>
            
            <h1 class="hub-title">Odyssea</h1>
            <div class="hub-subtitle">De l'idée à son incarnation dans le Monde</div>
            <div class="hub-actions">
                <button class="hub-btn" onclick="triggerImport()">📥 Importer Sauvegarde</button>
                <button class="hub-btn" onclick="exportData()">💾 Exporter mes Parties</button>
                <input type="file" id="import-file" style="display:none" onchange="handleImport(this)">
            </div>
            <div class="hub-grid">
                <div class="hub-card new" onclick="openGameInputModal('new')"><span>+</span><h3>Nouvelle Aventure</h3><p>Débuter un nouveau projet</p></div>
                <div id="hub-list" style="display:contents;"></div>
            </div>
        </div>
    </div>

    <div id="screen-game" class="app-container" style="display:none;">
        
        <aside class="sidebar" id="main-sidebar">
            <div class="brand" onclick="goHome()">
                <div class="logo-wrapper" style="width:50px; height:50px;"><img src="logoodyssea.jpeg" class="logo-img"></div>
                <button class="rename-btn-sidebar" onclick="event.stopPropagation(); openGameInputModal('rename')">✎ Renommer</button>
            </div>
            <ul class="nav-list" id="arcana-list"></ul>
            <div class="sidebar-footer">
                <button class="export-sidebar-btn" onclick="generatePDFReport()">📄 Exporter Rapport PDF</button>
            </div>
        </aside>

        <section class="avatar-column">
            <button id="toggle-video-size-btn" onclick="toggleVideoSize()">↕</button>
            
            <div class="video-wrapper">
                <div class="video-container">
                    <video id="avatar-video" class="avatar-video" playsinline onclick="videoControl('toggle')"></video>
                </div>
                <div class="video-controls-bar">
                    <button class="control-btn" onclick="videoControl('replay')">↺</button>
                    <button class="control-btn" id="vid-play-btn" onclick="videoControl('toggle')">▶</button>
                    <button class="control-btn" onclick="videoControl('stop')">■</button>
                </div>
            </div>
            <div id="card-portrait" class="card-info-panel">
                </div>
        </section>

        <section class="chat-column">
            <div class="chat-scroll-area" id="chat-container"></div>
            <div id="typing-indicator" class="typing-indicator">...</div>
            <div class="interaction-bar">
                <div class="input-wrapper">
                    <div id="api-status" class="api-status-dot" title="Statut Connexion API"></div>
                    <input type="text" id="user-input" class="chat-input" placeholder="Parle de ton projet..." onkeypress="handleEnter(event)">
                    <button id="lightning-btn" class="force-btn" onclick="openValidationModal('analysis')" title="Disponible après 2 échanges">⚡</button>
                    <button class="send-btn" onclick="sendMessage()">→</button>
                </div>
            </div>
        </section>
    </div>

    <audio id="tts-player"></audio>
    <script src="report.js"></script>
    <script src="script.js"></script>
</body>
</html>
